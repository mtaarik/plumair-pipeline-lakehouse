version: '3.8'

services:
  # ==========================================
  # 1. COUCHE TEMPS RÉEL (Ingestion & Buffer)
  # ==========================================

  # Kafka (KRaft Mode - Persistant)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: plumair-kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      # Volume nommé pour sauvegarder les topics et messages Kafka
      - plumair-kafka-data:/var/lib/kafka/data
    networks:
      - ocp-data-net

  # NiFi (Simulateur - Persistant)
  nifi:
    image: apache/nifi:1.23.2
    container_name: plumair-nifi
    ports:
      - "8443:8443"
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=PlumAir_OCP_2026!
    volumes:
      # Ton fichier CSV d'entrée
      - ../data/raw:/opt/nifi/nifi-current/data_in
      # Volumes nommés pour sauvegarder le travail et l'état de NiFi
      - plumair-nifi-conf:/opt/nifi/nifi-current/conf
      - plumair-nifi-state:/opt/nifi/nifi-current/state
    networks:
      - ocp-data-net

  # ==========================================
  # 2. COUCHE STOCKAGE & CALCUL (Lakehouse)
  # ==========================================

  # MinIO (Stockage Objet S3 compatible)
  minio:
    image: minio/minio
    container_name: plumair-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    command: server /data --console-address ":9001"
    volumes:
      # Stockage persistant pour garder tes fichiers Parquet / Iceberg
      - plumair-minio-data:/data
    networks:
      - ocp-data-net

  # PostgreSQL (Catalogue de métadonnées Iceberg)
  postgres:
    image: postgres:13
    container_name: plumair-metastore
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=iceberg
    ports:
      - "5432:5432"
    volumes:
      # Stockage persistant pour ne pas perdre la structure de tes tables
      - plumair-postgres-data:/var/lib/postgresql/data
    networks:
      - ocp-data-net

  # Trino (Moteur de calcul SQL distribué)
  trino:
    image: trinodb/trino
    container_name: plumair-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/iceberg.properties:/etc/trino/catalog/iceberg.properties
      - ./trino/kafka.properties:/etc/trino/catalog/kafka.properties
      - ./trino/kafka:/etc/trino/kafka
    depends_on:
      - minio
      - postgres
      - kafka
    networks:
      - ocp-data-net

# ==========================================
# 3. CONFIGURATION DES VOLUMES ET RÉSEAUX
# ==========================================

volumes:
  plumair-kafka-data:
  plumair-nifi-conf:
  plumair-nifi-state:
  plumair-minio-data:
  plumair-postgres-data:

networks:
  ocp-data-net:
    driver: bridge

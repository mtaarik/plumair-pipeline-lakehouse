version: '3.8'

services:
  # 1. Kafka (KRaft Mode - Persistant)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: plumair-kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      # Volume nommé pour sauvegarder les topics et messages Kafka
      - plumair-kafka-data:/var/lib/kafka/data
    networks:
      - ocp-data-net

  # 2. NiFi (Simulateur - Persistant)
  nifi:
    image: apache/nifi:1.23.2
    container_name: plumair-nifi
    ports:
      - "8443:8443"
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=PlumAir_OCP_2026!
    volumes:
      # Ton fichier CSV d'entrée
      - ../data/raw:/opt/nifi/nifi-current/data_in
      # Volumes nommés pour sauvegarder le travail et l'état de NiFi
      - plumair-nifi-conf:/opt/nifi/nifi-current/conf
      - plumair-nifi-state:/opt/nifi/nifi-current/state
    networks:
      - ocp-data-net

# Déclaration des volumes persistants gérés par Docker
volumes:
  plumair-kafka-data:
  plumair-nifi-conf:
  plumair-nifi-state:

networks:
  ocp-data-net:
    driver: bridge

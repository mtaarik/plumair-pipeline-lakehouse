version: 2

models:
  - name: silver_station
    description: "Table de référence (master data) des stations de mesure, dédupliquée."
    columns:
      - name: station_id
        tests: [not_null, unique]

  - name: silver_telemetry
    description: "Table transactionnelle des observations horaires par station, nettoyées et typées."
    columns:
      - name: station_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_station')
              field: station_id
      - name: measurement_time
        tests: [not_null]
      - name: temperature_c
        tests:
          - dbt_utils.accepted_range:
              min_value: -50
              max_value: 60
      - name: no2_ugm3
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [station_id, measurement_time]